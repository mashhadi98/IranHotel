services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD
        - /opt/mssql-tools18/bin/sqlcmd
        - -S
        - localhost
        - -U
        - sa
        - -P
        - ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
        - -C
        - -Q
        - SELECT 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__ApplicationDb: "Server=db,1433;Database=IranHotel;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Jwt__Issuer: http://localhost:8080
      Jwt__Audience: http://localhost:8080
      Jwt__AccessTokenMinutes: 60
      Jwt__RefreshTokenDays: 30
      Jwt__RequireHttpsMetadata: "false"
      AdminSeed__Email: ${ADMIN_SEED_EMAIL:-admin@example.local}
      AdminSeed__Password: ${ADMIN_SEED_PASSWORD:?Set ADMIN_SEED_PASSWORD in .env}
      AdminSeed__FirstName: ${ADMIN_SEED_FIRST_NAME:-Local}
      AdminSeed__LastName: ${ADMIN_SEED_LAST_NAME:-Admin}
      OpenIddict__Client__Id: ${OPENIDDICT_CLIENT_ID:-iranhotel-local-client}
      OpenIddict__Client__Secret: ${OPENIDDICT_CLIENT_SECRET:?Set OPENIDDICT_CLIENT_SECRET in .env}
      OpenIddict__Client__DisplayName: ${OPENIDDICT_CLIENT_DISPLAY_NAME:-IranHotel local client}
      OpenIddict__Client__RedirectUris__0: ${OPENIDDICT_REDIRECT_URI:-http://localhost:8080/callback}
      OpenIddict__Client__PostLogoutRedirectUris__0: ${OPENIDDICT_POST_LOGOUT_REDIRECT_URI:-http://localhost:8080/signout-callback}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  sqlserver-data:
